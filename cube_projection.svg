<svg xmlns="http://www.w3.org/2000/svg" width="440" height="460" viewBox="0 0 440 460">
  <rect width="440" height="460" fill="#1a1a2e"/>

  <!-- axes -->
  <line x1="10" y1="230" x2="430" y2="230" stroke="#2a2a4a" stroke-width="1"/>
  <line x1="220" y1="10" x2="220" y2="450" stroke="#2a2a4a" stroke-width="1"/>
  <text x="424" y="225" fill="#2a2a4a" font-size="11" font-family="monospace">x</text>
  <text x="224" y="18"  fill="#2a2a4a" font-size="11" font-family="monospace">y</text>

  <!-- SVG coords: sx = 220 + x*120, sy = 230 - y*120
       1:(220,  25.2)   2:(220, 194.8)  3:(389.7,145.2)  4:(389.7,314.8)
       5:( 50.3,145.2)  6:( 50.3,314.8) 7:(220, 265.2)   8:(220, 434.8) -->

  <!-- hidden edges (dashed, blue) -->
  <!-- 1-2: z_avg = -1.0 -->
  <line x1="220"   y1="25.2"  x2="220"   y2="194.8"
        stroke="#5577cc" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.55"/>
  <!-- 3-4: z_avg = 0.0 (borderline) -->
  <line x1="389.7" y1="145.2" x2="389.7" y2="314.8"
        stroke="#5577cc" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.55"/>
  <!-- 5-6: z_avg = 0.0 (borderline) -->
  <line x1="50.3"  y1="145.2" x2="50.3"  y2="314.8"
        stroke="#5577cc" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.55"/>
  <!-- 2-4: z_avg = -1.207 -->
  <line x1="220"   y1="194.8" x2="389.7" y2="314.8"
        stroke="#5577cc" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.55"/>
  <!-- 2-6: z_avg = -1.207 -->
  <line x1="220"   y1="194.8" x2="50.3"  y2="314.8"
        stroke="#5577cc" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.55"/>
  <!-- 4-8: z_avg = -0.207 -->
  <line x1="389.7" y1="314.8" x2="220"   y2="434.8"
        stroke="#5577cc" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.55"/>
  <!-- 6-8: z_avg = -0.207 -->
  <line x1="50.3"  y1="314.8" x2="220"   y2="434.8"
        stroke="#5577cc" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.55"/>

  <!-- visible edges (solid, white) -->
  <!-- 7-8: z_avg = 1.0 -->
  <line x1="220"   y1="265.2" x2="220"   y2="434.8"
        stroke="#e8e8ff" stroke-width="2.2"/>
  <!-- 1-3: z_avg = 0.207 -->
  <line x1="220"   y1="25.2"  x2="389.7" y2="145.2"
        stroke="#e8e8ff" stroke-width="2.2"/>
  <!-- 1-5: z_avg = 0.207 -->
  <line x1="220"   y1="25.2"  x2="50.3"  y2="145.2"
        stroke="#e8e8ff" stroke-width="2.2"/>
  <!-- 3-7: z_avg = 1.207 -->
  <line x1="389.7" y1="145.2" x2="220"   y2="265.2"
        stroke="#e8e8ff" stroke-width="2.2"/>
  <!-- 5-7: z_avg = 1.207 -->
  <line x1="50.3"  y1="145.2" x2="220"   y2="265.2"
        stroke="#e8e8ff" stroke-width="2.2"/>

  <!-- vertices -->
  <circle cx="220"   cy="25.2"  r="4.5" fill="#ff6b6b" opacity="0.5"/>
  <circle cx="220"   cy="194.8" r="4.5" fill="#ff6b6b" opacity="0.5"/>
  <circle cx="389.7" cy="145.2" r="4.5" fill="#ff6b6b"/>
  <circle cx="389.7" cy="314.8" r="4.5" fill="#ff6b6b" opacity="0.5"/>
  <circle cx="50.3"  cy="145.2" r="4.5" fill="#ff6b6b"/>
  <circle cx="50.3"  cy="314.8" r="4.5" fill="#ff6b6b" opacity="0.5"/>
  <circle cx="220"   cy="265.2" r="4.5" fill="#ff6b6b"/>
  <circle cx="220"   cy="434.8" r="4.5" fill="#ff6b6b"/>

  <!-- vertex labels -->
  <text x="225"  y="23"   fill="#cc8888" font-size="11" font-family="monospace" opacity="0.6">1</text>
  <text x="225"  y="192"  fill="#cc8888" font-size="11" font-family="monospace" opacity="0.6">2</text>
  <text x="394"  y="143"  fill="#cc8888" font-size="11" font-family="monospace">3</text>
  <text x="394"  y="312"  fill="#cc8888" font-size="11" font-family="monospace" opacity="0.6">4</text>
  <text x="32"   y="143"  fill="#cc8888" font-size="11" font-family="monospace">5</text>
  <text x="32"   y="312"  fill="#cc8888" font-size="11" font-family="monospace" opacity="0.6">6</text>
  <text x="225"  y="263"  fill="#cc8888" font-size="11" font-family="monospace">7</text>
  <text x="225"  y="433"  fill="#cc8888" font-size="11" font-family="monospace">8</text>

  <!-- legend -->
  <line x1="20" y1="448" x2="48" y2="448" stroke="#e8e8ff" stroke-width="2.2"/>
  <text x="53" y="452" fill="#aaaacc" font-size="11" font-family="monospace">visible (z &gt; 0)</text>
  <line x1="175" y1="448" x2="203" y2="448" stroke="#5577cc" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.8"/>
  <text x="208" y="452" fill="#aaaacc" font-size="11" font-family="monospace">hidden (z &lt; 0)</text>
</svg>
